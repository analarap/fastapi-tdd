name: CI

on:
  push:
    branches: [green]
  pull_request:
    branches: [green]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn black flake8 pytest httpx

      - name: Run Black
        run: |
          black --check .

      - name: Run Flake8
        run: |
          flake8 .

      - name: Run Pytest
        run: |
          pytest
